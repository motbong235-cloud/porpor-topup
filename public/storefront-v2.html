<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#082044" />
  <meta name="description" content="Porpor Topup — ទិញ diamond, UC, Robux លើន សុវត្ថិភាព" />
  <title>Porpor Topup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #082044; --navy-2: #0c2d5c; --brand: #1d6adf; --brand-2: #3b82f6; --ice: #e8f1ff;
      --bg: #070f1c; --surface: #0f1c32; --card: #13233f; --card2: #182a4a;
      --line: rgba(232, 241, 255, 0.08); --text: #f0f6ff; --muted: #8ba3c7;
      --ok: #34d399; --warn: #fbbf24; --danger: #f87171; --radius: 16px;
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100dvh; line-height: 1.45;
      -webkit-font-smoothing: antialiased; padding-bottom: calc(72px + var(--safe-b));
    }
    a { color: inherit; text-decoration: none; }
    button, input, select { font: inherit; color: inherit; }
    .hide { display: none !important; }
    .app { max-width: 480px; margin: 0 auto; min-height: 100dvh; position: relative; }
    .topbar {
      position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; background: rgba(7, 15, 28, 0.92); backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; letter-spacing: -0.02em; flex: 1; min-width: 0; }
    .logo-mark {
      width: 36px; height: 36px; border-radius: 11px;
      background: linear-gradient(145deg, var(--brand), var(--navy));
      display: grid; place-items: center; font-size: 11px; font-weight: 800;
      box-shadow: 0 4px 14px rgba(29, 106, 223, 0.35); flex-shrink: 0;
    }
    .logo-text span { color: var(--brand-2); }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 999px; border: 1px solid var(--line);
      background: var(--surface); display: grid; place-items: center; cursor: pointer;
    }
    .login-btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px;
      border: 1.5px solid var(--brand);
      background: linear-gradient(180deg, rgba(29,106,223,.25), rgba(8,32,68,.6));
      color: #fff; font-weight: 700; font-size: 13px; cursor: pointer;
    }
    .banner-wrap { padding: 12px 14px 4px; }
    .banner {
      position: relative; border-radius: 18px; overflow: hidden;
      background: linear-gradient(135deg, #1d6adf 0%, #082044 55%, #0a4a9e 100%);
      min-height: 148px; padding: 18px 16px;
      box-shadow: 0 12px 32px rgba(29, 106, 223, 0.25);
    }
    .banner h2 { font-size: 1.35rem; font-weight: 800; line-height: 1.2; }
    .banner p { margin-top: 6px; font-size: 12.5px; opacity: 0.9; max-width: 70%; }
    .banner-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .banner-badges span {
      font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 999px;
      background: rgba(255,255,255,.15);
    }
    .cats { display: flex; gap: 10px; padding: 14px 14px 6px; align-items: center; }
    .cat {
      display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px;
      cursor: pointer; border: none; background: none; color: var(--muted); font-size: 11px; font-weight: 600;
    }
    .cat.active { color: var(--text); }
    .cat-icon {
      width: 48px; height: 48px; border-radius: 14px; background: var(--card); border: 1px solid var(--line);
      display: grid; place-items: center; font-size: 20px;
    }
    .cat.active .cat-icon { border-color: var(--brand); background: rgba(29,106,223,.18); }
    .view-all {
      margin-left: auto; font-size: 12px; font-weight: 700; color: var(--brand-2);
      background: var(--card); border: 1px solid var(--line); padding: 8px 12px; border-radius: 999px; cursor: pointer;
    }
    .section { padding: 12px 14px 8px; }
    .sec-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; }
    .sec-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 800; }
    .sec-title .star { color: var(--brand-2); }
    .sec-pill {
      font-size: 11px; font-weight: 700; padding: 5px 10px; border-radius: 999px;
      background: rgba(29,106,223,.2); color: var(--brand-2); border: 1px solid rgba(29,106,223,.35);
    }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    @media (min-width: 420px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    .game-card {
      background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
      cursor: pointer; position: relative;
    }
    .game-thumb {
      aspect-ratio: 1; background: var(--card2); display: grid; place-items: center; font-size: 42px;
      background-image: radial-gradient(circle at 30% 20%, rgba(29,106,223,.35), transparent 55%);
    }
    .badge-top {
      position: absolute; top: 0; left: 0;
      background: linear-gradient(90deg, var(--brand), var(--brand-2));
      color: #fff; font-size: 9px; font-weight: 800; padding: 4px 8px 4px 6px; border-radius: 0 0 10px 0;
    }
    .game-body { padding: 8px 10px 10px; }
    .game-name { font-size: 12.5px; font-weight: 700; line-height: 1.25; min-height: 2.5em; }
    .topup-btn {
      margin-top: 8px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 4px;
      padding: 8px; border-radius: 10px; border: none;
      background: linear-gradient(180deg, var(--brand-2), var(--brand));
      color: #fff; font-size: 12px; font-weight: 800; cursor: pointer;
    }
    .unavail {
      margin-top: 8px; text-align: center; font-size: 11px; font-weight: 700; color: var(--danger);
      padding: 8px; border-radius: 10px; background: rgba(248,113,113,.1);
    }
    .bottom-nav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; max-width: 480px; margin: 0 auto;
      display: flex; justify-content: space-around; padding: 8px 6px calc(8px + var(--safe-b));
      background: rgba(15, 28, 50, 0.96); backdrop-filter: blur(12px); border-top: 1px solid var(--line);
    }
    .nav-item {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
      background: none; border: none; color: var(--muted); font-size: 10px; font-weight: 600; cursor: pointer; padding: 4px;
    }
    .nav-item.active { color: var(--brand-2); }
    .nav-item svg { width: 22px; height: 22px; }
    .fab-chat {
      position: fixed; right: max(14px, calc(50% - 240px + 14px));
      bottom: calc(78px + var(--safe-b)); z-index: 45; width: 52px; height: 52px; border-radius: 999px; border: none;
      background: linear-gradient(145deg, var(--brand-2), var(--navy)); color: #fff; font-size: 22px; cursor: pointer;
      box-shadow: 0 8px 24px rgba(29,106,223,.45);
    }
    .page { display: none; }
    .page.active { display: block; }
    .panel { padding: 16px 14px 24px; }
    .panel h2 { font-size: 1.2rem; font-weight: 800; margin-bottom: 4px; }
    .panel .hint { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
    .field input {
      width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
      background: var(--card); outline: none;
    }
    .btn-primary {
      width: 100%; padding: 14px; border: none; border-radius: 12px;
      background: linear-gradient(180deg, var(--brand-2), var(--brand));
      color: #fff; font-weight: 800; font-size: 15px; cursor: pointer;
    }
    .btn-ghost {
      width: 100%; padding: 12px; border-radius: 12px; margin-top: 8px;
      border: 1px solid var(--line); background: transparent; color: var(--text); font-weight: 700; cursor: pointer;
    }
    .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
    .stat label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
    .stat strong { display: block; margin-top: 4px; font-size: 1.25rem; font-weight: 800; color: var(--brand-2); }
    .detail-hero {
      padding: 16px 14px; display: flex; gap: 14px; align-items: center;
      background: var(--surface); border-bottom: 1px solid var(--line);
    }
    .detail-icon {
      width: 72px; height: 72px; border-radius: 18px; background: var(--card);
      display: grid; place-items: center; font-size: 36px; border: 1px solid var(--line);
    }
    .pack-list { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
    .pack {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px;
      background: var(--card); border: 1.5px solid var(--line); cursor: pointer;
    }
    .pack.selected { border-color: var(--brand); background: rgba(29,106,223,.12); }
    .pack-info { flex: 1; }
    .pack-price { font-weight: 800; color: var(--brand-2); font-size: 15px; }
    .order-box {
      margin: 8px 14px 20px; padding: 16px; border-radius: 16px;
      background: var(--surface); border: 1px solid var(--line);
    }
    .toast {
      position: fixed; left: 50%; bottom: calc(90px + var(--safe-b)); transform: translateX(-50%);
      background: var(--navy); color: #fff; padding: 12px 18px; border-radius: 12px;
      font-size: 13px; font-weight: 600; opacity: 0; transition: .25s; z-index: 100; pointer-events: none;
    }
    .toast.show { opacity: 1; }
    .back { font-size: 13px; font-weight: 700; color: var(--brand-2); background: none; border: none; cursor: pointer; }
    .search-box { padding: 10px 14px; }
    .search-box input {
      width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card);
    }
    .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
    .order-row { padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
    .badge { display: inline-flex; padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 800; }
    .badge-ok { background: rgba(52,211,153,.15); color: var(--ok); }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a href="#" class="logo" data-nav="home"><span class="logo-mark">PP</span><span class="logo-text">Porpor <span>Topup</span></span></a>
      <button type="button" class="icon-btn" id="btnSearch">🔍</button>
      <button type="button" class="login-btn" id="btnAuth"><span id="authLabel">Login</span></button>
    </header>
    <div class="page active" id="page-home">
      <div class="banner-wrap"><div class="banner">
        <h2>Welcome to<br/>Porpor Topup</h2>
        <p>ទិញ Diamond · UC · Robux លើន សុវត្ថិភាព</p>
        <div class="banner-badges"><span>⚡ Auto</span><span>🛡️ Secure</span><span>💬 24/7</span><span>🇰🇭 KH</span></div>
      </div></div>
      <div class="cats">
        <button type="button" class="cat active" data-filter="all"><span class="cat-icon">🎮</span> Game</button>
        <button type="button" class="cat" data-filter="gift"><span class="cat-icon">🎁</span> Giftcard</button>
        <button type="button" class="view-all" data-nav="all">View all</button>
      </div>
      <section class="section">
        <div class="sec-head"><div class="sec-title"><span class="star">★</span> Trending Game</div><span class="sec-pill" id="trendCount">0</span></div>
        <div class="grid" id="trendGrid"></div>
      </section>
      <section class="section" id="allSection">
        <div class="sec-head"><div class="sec-title"><span class="star">◆</span> All Games</div><span class="sec-pill" id="allCount">0</span></div>
        <div class="grid" id="allGrid"></div>
      </section>
    </div>
    <div class="page" id="page-search">
      <div class="search-box"><input type="search" id="searchInput" placeholder="ស្វែងរក game…" /></div>
      <div class="section"><div class="grid" id="searchGrid"></div><div class="empty hide" id="searchEmpty">រកមិននៃន</div></div>
    </div>
    <div class="page" id="page-game">
      <div style="padding:10px 14px"><button type="button" class="back" data-nav="home">← ត្រាល្ប</button></div>
      <div class="detail-hero"><div class="detail-icon" id="gIcon">🎮</div><div><h1 id="gName">—</h1><p id="gMeta" style="color:var(--muted);font-size:12px">—</p></div></div>
      <div class="pack-list" id="packList"></div>
      <div class="order-box">
        <div class="field"><label>Player ID</label><input id="playerId" placeholder="Player ID" /></div>
        <div class="field"><label>Server (optional)</label><input id="playerServer" /></div>
        <button type="button" class="btn-primary" id="btnOrder">បញ្ជាទិញ</button>
        <p style="margin-top:10px;font-size:12px;color:var(--muted);text-align:center">Balance: <strong id="balHint" style="color:var(--brand-2)">$0.00</strong></p>
      </div>
    </div>
    <div class="page" id="page-wallet">
      <div class="panel">
        <h2>Wallet</h2><p class="hint">Demo deposit</p>
        <div class="stat-row"><div class="stat"><label>Balance</label><strong id="walletBal">$0</strong></div><div class="stat"><label>Orders</label><strong id="walletOrders">0</strong></div></div>
        <div class="field"><label>Amount USD</label><input id="depAmt" type="number" value="10" min="1" /></div>
        <button type="button" class="btn-primary" id="btnDeposit">Demo Deposit</button>
      </div>
    </div>
    <div class="page" id="page-orders">
      <div class="panel"><h2>Orders</h2><p class="hint">History</p><div id="ordersList"></div></div>
    </div>
    <div class="page" id="page-account">
      <div class="panel">
        <h2 id="accTitle">Login</h2><p class="hint" id="accHint">Porpor Topup account</p>
        <div id="authForm">
          <div class="field"><label>Email</label><input id="authUser" /></div>
          <div class="field"><label>Password</label><input id="authPass" type="password" /></div>
          <button type="button" class="btn-primary" id="btnLogin">Login</button>
          <button type="button" class="btn-ghost" id="btnRegister">Register</button>
          <p style="margin-top:12px;font-size:12px;color:var(--muted)">Demo: demo@porpor.com / Demo123!</p>
        </div>
        <div id="accProfile" class="hide">
          <div class="stat-row"><div class="stat"><label>User</label><strong id="profUser" style="font-size:14px">—</strong></div><div class="stat"><label>Balance</label><strong id="profBal">$0</strong></div></div>
          <button type="button" class="btn-primary" data-nav="wallet">Wallet</button>
          <button type="button" class="btn-ghost" id="btnLogout">Logout</button>
        </div>
      </div>
    </div>
    <nav class="bottom-nav">
      <button type="button" class="nav-item active" data-nav="home">Home</button>
      <button type="button" class="nav-item" data-nav="orders">Orders</button>
      <button type="button" class="nav-item" data-nav="wallet">Wallet</button>
      <button type="button" class="nav-item" data-nav="account">Account</button>
    </nav>
    <button type="button" class="fab-chat" id="fabChat">💬</button>
  </div>
  <div class="toast" id="toast"></div>
  <script>
  const GAMES=[{id:"ff-kh",name:"Free Fire (KH)",region:"Cambodia",emoji:"🔥",trending:true,type:"game",packs:[{id:"ff-100",label:"100 Diamonds",price:0.95},{id:"ff-310",label:"310 Diamonds",price:2.75},{id:"ff-520",label:"520 Diamonds",price:4.5}]},{id:"mlbb-kh",name:"MLBB (KH)",region:"Cambodia",emoji:"⚔️",trending:true,type:"game",packs:[{id:"ml-86",label:"86 Diamonds",price:1.15},{id:"ml-172",label:"172 Diamonds",price:2.25},{id:"ml-344",label:"344 Diamonds",price:4.45}]},{id:"pubg",name:"PUBG Mobile",region:"Global",emoji:"🎯",trending:true,type:"game",packs:[{id:"pg-60",label:"60 UC",price:0.9},{id:"pg-325",label:"325 UC",price:4.4}]},{id:"roblox",name:"Roblox",region:"Global",emoji:"🟦",trending:true,type:"game",packs:[{id:"rx-80",label:"80 Robux",price:0.95},{id:"rx-400",label:"400 Robux",price:4.7}]},{id:"blox",name:"Blox Fruits",region:"Global",emoji:"🍊",trending:true,type:"game",packs:[{id:"bf-1",label:"1,000 Fruit",price:1.2}]},{id:"roblox-gc",name:"Roblox Giftcard",region:"Global",emoji:"🎴",trending:true,type:"gift",packs:[{id:"rbx-10",label:"$10 GC",price:10.5}]},{id:"hok",name:"Honor of Kings",region:"Global",emoji:"👑",type:"game",packs:[{id:"hok-1",label:"60 Tokens",price:0.95}]},{id:"valo-kh",name:"Valorant (KH)",region:"Cambodia",emoji:"🔫",type:"game",packs:[{id:"val-1",label:"125 Points",price:1.5}]}];
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  let user=JSON.parse(localStorage.getItem("pp_user")||"null")||{email:null,balance:0,orders:[]};
  let selectedGame=null,selectedPack=null,filter="all";
  const money=n=>"$"+Number(n).toFixed(2);
  function save(){localStorage.setItem("pp_user",JSON.stringify(user))}
  function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400)}
  function card(g){const a=g.available!==false;return `<article class="game-card" data-id="${g.id}"><div class="game-thumb">${g.trending?'<span class="badge-top">TOP</span>':''}<span>${g.emoji}</span></div><div class="game-body"><div class="game-name">${g.name}</div>${a?`<button type="button" class="topup-btn" data-id="${g.id}">TOP UP</button>`:'<div class="unavail">UNAVAILABLE</div>'}</div></article>`}
  function renderHome(){const t=GAMES.filter(g=>g.trending),a=GAMES.filter(g=>filter==="all"||g.type===filter);$("#trendCount").textContent=t.length+" items";$("#allCount").textContent=a.length+" games";$("#trendGrid").innerHTML=t.map(card).join("");$("#allGrid").innerHTML=a.map(card).join("")}
  function showPage(n){$$(".page").forEach(p=>p.classList.toggle("active",p.id==="page-"+n));$$(".nav-item").forEach(x=>x.classList.toggle("active",x.dataset.nav===n||(n==="game"&&x.dataset.nav==="home")));if(n==="wallet"){user=JSON.parse(localStorage.getItem("pp_user")||"null")||user;$("#walletBal").textContent=money(user.balance||0);$("#walletOrders").textContent=String((user.orders||[]).length)}if(n==="orders"){const list=user.orders||[];$("#ordersList").innerHTML=list.length?list.map(o=>`<div class="order-row"><strong>${o.game} · ${o.pack}</strong> <span class="badge badge-ok">${o.status}</span><div style="color:var(--muted);font-size:12px">${o.playerId} · ${money(o.price)}</div></div>`).join(""):'<div class="empty">No orders</div>'}if(n==="account"){const logged=!!user.email;$("#authForm").classList.toggle("hide",logged);$("#accProfile").classList.toggle("hide",!logged);$("#authLabel").textContent=logged?(user.email.split("@")[0]):"Login";if(logged){$("#profUser").textContent=user.email;$("#profBal").textContent=money(user.balance||0)}}}
  function openGame(id){const g=GAMES.find(x=>x.id===id);if(!g)return;selectedGame=g;selectedPack=g.packs[0];$("#gIcon").textContent=g.emoji;$("#gName").textContent=g.name;$("#gMeta").textContent=g.region;$("#packList").innerHTML=g.packs.map((p,i)=>`<div class="pack ${i===0?"selected":""}" data-pid="${p.id}"><div class="pack-info"><strong>${p.label}</strong></div><div class="pack-price">${money(p.price)}</div></div>`).join("");$("#balHint").textContent=money(user.balance||0);showPage("game")}
  document.body.addEventListener("click",e=>{const nav=e.target.closest("[data-nav]");if(nav){e.preventDefault();const p=nav.dataset.nav;if(p==="all"){filter="all";renderHome();showPage("home");return}showPage(p);return}const c=e.target.closest(".topup-btn,.game-card");if(c&&c.closest("#trendGrid,#allGrid,#searchGrid")){const id=c.dataset.id||c.closest("[data-id]")?.dataset.id;if(id)openGame(id);return}const pack=e.target.closest(".pack");if(pack&&selectedGame){$$(".pack").forEach(x=>x.classList.remove("selected"));pack.classList.add("selected");selectedPack=selectedGame.packs.find(p=>p.id===pack.dataset.pid)}});
  $$(".cat").forEach(c=>c.onclick=()=>{filter=c.dataset.filter;$$(".cat").forEach(x=>x.classList.toggle("active",x===c));renderHome()});
  $("#btnSearch").onclick=()=>{showPage("search");$("#searchInput").focus()};
  $("#searchInput").oninput=()=>{const q=$("#searchInput").value.trim().toLowerCase();const hits=GAMES.filter(g=>g.name.toLowerCase().includes(q));$("#searchGrid").innerHTML=hits.map(card).join("");$("#searchEmpty").classList.toggle("hide",hits.length>0)};
  $("#btnAuth").onclick=()=>showPage("account");
  $("#btnLogin").onclick=()=>{const email=($("#authUser").value||"").trim().toLowerCase(),pass=$("#authPass").value||"";if(!email||!pass)return toast("Need email+password");if(email==="demo@porpor.com"&&pass!=="Demo123!")return toast("Wrong password");user=JSON.parse(localStorage.getItem("pp_user")||"null")||{balance:0,orders:[]};if(email==="demo@porpor.com"&&!user.email)user.balance=20;user.email=email;user.orders=user.orders||[];save();toast("Login ok");showPage("account")};
  $("#btnRegister").onclick=()=>{const email=($("#authUser").value||"").trim().toLowerCase(),pass=$("#authPass").value||"";if(!email||pass.length<6)return toast("Invalid");user={email,balance:0,orders:[]};save();toast("Registered");showPage("account")};
  $("#btnLogout").onclick=()=>{user={email:null,balance:user.balance||0,orders:user.orders||[]};localStorage.removeItem("pp_user");toast("Logout");showPage("account")};
  $("#btnDeposit").onclick=()=>{if(!user.email){toast("Login first");return showPage("account")}const amt=Number($("#depAmt").value);if(!(amt>=1))return toast("Min $1");user.balance=Math.round((user.balance+amt)*100)/100;save();toast("Deposited");showPage("wallet")};
  $("#btnOrder").onclick=()=>{if(!user.email){toast("Login first");return showPage("account")}if(!selectedPack)return;const pid=($("#playerId").value||"").trim();if(!pid)return toast("Player ID");if(user.balance<selectedPack.price){toast("Low balance");return showPage("wallet")}user.balance=Math.round((user.balance-selectedPack.price)*100)/100;user.orders=user.orders||[];user.orders.unshift({game:selectedGame.name,pack:selectedPack.label,playerId:pid,price:selectedPack.price,status:"SUCCESS",at:new Date().toISOString()});save();toast("Success");$("#balHint").textContent=money(user.balance)};
  $("#fabChat").onclick=()=>toast("Live chat demo");
  renderHome();
  </script>
</body>
</html>
