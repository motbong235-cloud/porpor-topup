services:
  - type: web
    name: porpor-topup
    runtime: node
    plan: starter
    region: singapore
    buildCommand: bash render-build.sh
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /var/data
      - key: ABA_API_KEY
        sync: false
      - key: ABA_MERCHANT_ID
        sync: false
      - key: KHMER_TOPUP_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: QR_EXPIRE_SEC
        value: "3600"
    healthCheckPath: /api/health
    disk:
      name: porpor-data
      mountPath: /var/data
      sizeGB: 1
