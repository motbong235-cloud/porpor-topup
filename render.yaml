services:
  - type: web
    name: porpor-topup
    runtime: node
    plan: starter
    region: singapore
    buildCommand: bash render-build.sh
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: ABA_API_KEY
        sync: false
      - key: ABA_MERCHANT_ID
        sync: false
      - key: KHMER_TOPUP_API_KEY
        sync: false
    healthCheckPath: /api/health
    # Persistent disk: keeps selected services, orders and uploaded images across deploys/restarts
    disk:
      name: porpor-data
      mountPath: /var/data
      sizeGB: 1
